<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>

          font-size: 14px; pointer-events: none; text-shadow: 0 1px 2px #000; padding: 0 10px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

  }
}
</script>
</head>
<body>
<div id="info">
  Djembe VR. In a headset: press ENTER VR and play with your bare hands.<br>
  On a computer: click the drum (center = bass, edge = tone, Shift + click = slap). Keys: 1 = Free mode, 2 = Rhythm mode, B / T / S = sounds.
</div>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================================================
// Basic scene
// =====================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c0e06);
scene.fog = new THREE.Fog(0x1c0e06, 5, 16);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 60);
camera.position.set(0, 1.35, 0.75);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer, { optionalFeatures: ['hand-tracking'] }));

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.75, 0);
controls.update();

const clock = new THREE.Clock();

// =====================================================================
// Lights and environment (a warm evening village scene)
// =====================================================================
scene.add(new THREE.HemisphereLight(0xffe0b0, 0x3a2010, 1.3));
const sun = new THREE.DirectionalLight(0xffc880, 1.8);
sun.position.set(1.5, 3, 1.5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(16, 64),
  new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Stars
{
  const starPos = [];
  for (let i = 0; i < 800; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 0.45;
    const r = 40;
    starPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi) + 2, r * Math.sin(phi) * Math.sin(theta));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xfff2d0, size: 0.12, fog: false }));
  scene.add(stars);
}

// Simple trees around the place
function makeTree(x, z, h) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.14, h, 8),
    new THREE.MeshStandardMaterial({ color: 0x4a2c16, roughness: 1 })
  );
  trunk.position.y = h / 2;
  tree.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(h * 0.45, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0x2f5a1e, roughness: 1 })
  );
  leaves.position.y = h * 1.05;
  leaves.scale.y = 0.6;
  tree.add(leaves);
  tree.position.set(x, 0, z);
  scene.add(tree);
}
makeTree(-3.5, -4, 2.6); makeTree(3.8, -3.2, 3.0); makeTree(-5, 1.5, 2.2);
makeTree(5.2, 2.5, 2.8); makeTree(0.8, -6.5, 3.4); makeTree(-2, -7, 2.4);

// Campfire
const fireLight = new THREE.PointLight(0xff7a2a, 6, 7, 1.5);
fireLight.position.set(-1.4, 0.5, -2.0);
scene.add(fireLight);
const flame = new THREE.Mesh(
  new THREE.ConeGeometry(0.18, 0.5, 12),
  new THREE.MeshBasicMaterial({ color: 0xff8a2a })
);
flame.position.set(-1.4, 0.3, -2.0);
scene.add(flame);
for (let i = 0; i < 4; i++) {
  const log = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.04, 0.6, 8),
    new THREE.MeshStandardMaterial({ color: 0x3a2010 })
  );
  log.rotation.z = Math.PI / 2;
  log.rotation.y = i * Math.PI / 4;
  log.position.set(-1.4, 0.05, -2.0);
  scene.add(log);
}

// Woven mat under the drum
const mat = new THREE.Mesh(
  new THREE.CircleGeometry(0.9, 40),
  new THREE.MeshStandardMaterial({ color: 0xc89a52, roughness: 1 })
);
mat.rotation.x = -Math.PI / 2;
mat.position.y = 0.002;
mat.receiveShadow = true;

// =====================================================================
// The playing station (drum + panel + buttons). It is placed in front
// of the player when VR starts.
// =====================================================================
const station = new THREE.Group();
scene.add(station);
station.add(mat);

const R = 0.17;          // radius of the drum skin (meters)
let SKIN_Y = 0.72;       // height of the drum skin (adjusted to the player)
const BASE_SKIN_Y = 0.72;

const COLORS = { bass: 0xff6a2a, tone: 0xffd23a, slap: 0x3ad7ff };
const CSS_COLORS = { bass: '#ff6a2a', tone: '#ffd23a', slap: '#3ad7ff' };

// Wood texture with Benin colour bands
function makeWoodTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#6b3a1e';
  g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 220; i++) {
    g.strokeStyle = `rgba(${(40 + Math.random() * 30) | 0},${(20 + Math.random() * 15) | 0},10,${0.15 + Math.random() * 0.25})`;
    g.lineWidth = 1 + Math.random() * 3;
    const x = Math.random() * 512;
    g.beginPath();
    g.moveTo(x, 0);
    g.bezierCurveTo(x + Math.random() * 20 - 10, 170, x + Math.random() * 20 - 10, 340, x + Math.random() * 10 - 5, 512);
    g.stroke();
  }
  const band = (v, h) => {
    const y = (1 - v) * 512;
    ['#1e8a3a', '#f2c81e', '#d42a1e'].forEach((col, k) => { g.fillStyle = col; g.fillRect(0, y + k * h, 512, h); });
  };
  band(0.88, 7);
  band(0.12, 6);
  g.strokeStyle = 'rgba(30,15,5,0.8)';
  g.lineWidth = 4;
  const yz = (1 - 0.75) * 512;
  g.beginPath();
  for (let x = 0; x <= 512; x += 32) g.lineTo(x, yz + (((x / 32) % 2) ? 12 : -12));
  g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

// Drum body (goblet shape). Scaled in height to fit the player.
const drumBody = new THREE.Group();
station.add(drumBody);
{
  const pts = [
    [0.13, 0], [0.14, 0.02], [0.12, 0.08], [0.09, 0.18], [0.075, 0.28], [0.08, 0.36],
    [0.11, 0.44], [0.15, 0.54], [0.175, 0.63], [0.18, 0.69], [0.175, 0.715]
  ].map(([x, y]) => new THREE.Vector2(x, y));
  const body = new THREE.Mesh(
    new THREE.LatheGeometry(pts, 48),
    new THREE.MeshStandardMaterial({ map: makeWoodTexture(), roughness: 0.7, side: THREE.DoubleSide })
  );
  body.castShadow = true;
  drumBody.add(body);

  // Ropes
  const ropePts = [];
  const N = 24;
  for (let i = 0; i < N; i++) {
    const a1 = i / N * Math.PI * 2, a2 = (i + 0.5) / N * Math.PI * 2, a3 = (i + 1) / N * Math.PI * 2;
    const top1 = new THREE.Vector3(Math.cos(a1) * 0.186, 0.70, Math.sin(a1) * 0.186);
    const low = new THREE.Vector3(Math.cos(a2) * 0.123, 0.46, Math.sin(a2) * 0.123);
    const top2 = new THREE.Vector3(Math.cos(a3) * 0.186, 0.70, Math.sin(a3) * 0.186);
    ropePts.push(top1, low, low, top2);
  }
  drumBody.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(ropePts),
    new THREE.LineBasicMaterial({ color: 0xe8e0c8 })
  ));
  const ropeMat = new THREE.MeshStandardMaterial({ color: 0xe8e0c8, roughness: 1 });
  const ring1 = new THREE.Mesh(new THREE.TorusGeometry(0.186, 0.006, 6, 48), ropeMat);
  ring1.rotation.x = Math.PI / 2; ring1.position.y = 0.70;
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.123, 0.006, 6, 48), ropeMat);
  ring2.rotation.x = Math.PI / 2; ring2.position.y = 0.46;
  drumBody.add(ring1, ring2);
}

// Drum top (skin, rim, bass zone ring). Not scaled, only moved.
const drumTop = new THREE.Group();
station.add(drumTop);
const skinMat = new THREE.MeshStandardMaterial({ color: 0xe8d2a6, roughness: 0.9, emissive: 0x000000 });
const skin = new THREE.Mesh(new THREE.CircleGeometry(R, 48), skinMat);
skin.rotation.x = -Math.PI / 2;
drumTop.add(skin);
const rim = new THREE.Mesh(
  new THREE.TorusGeometry(R + 0.006, 0.009, 8, 48),
  new THREE.MeshStandardMaterial({ color: 0x3b2412, roughness: 0.8 })
);
rim.rotation.x = Math.PI / 2;
drumTop.add(rim);
const zoneRing = new THREE.Mesh(
  new THREE.RingGeometry(R * 0.48, R * 0.5, 48),
  new THREE.MeshBasicMaterial({ color: 0x8a6a40, transparent: true, opacity: 0.6 })
);
zoneRing.rotation.x = -Math.PI / 2;
zoneRing.position.y = 0.001;
drumTop.add(zoneRing);

// =====================================================================
// Info panel (canvas texture)
// =====================================================================
const panelCanvas = document.createElement('canvas');
panelCanvas.width = 1024; panelCanvas.height = 512;
const pctx = panelCanvas.getContext('2d');
const panelTex = new THREE.CanvasTexture(panelCanvas);
panelTex.colorSpace = THREE.SRGBColorSpace;
const panel = new THREE.Mesh(
  new THREE.PlaneGeometry(0.64, 0.32),
  new THREE.MeshBasicMaterial({ map: panelTex, transparent: true })
);
panel.rotation.x = -0.2;
station.add(panel);

const state = {
  mode: 'free',
  score: 0,
  combo: 0,
  bestCombo: 0,
  hits: 0,
  totalNotes: 0,
  judge: 'Hit the drum!',
  judgeColor: '#ffffff',
  judgeUntil: Infinity,
  finished: false,
};

function drawPanel() {
  const g = pctx;
  g.clearRect(0, 0, 1024, 512);
  g.beginPath();
  g.roundRect(8, 8, 1008, 496, 40);
  g.fillStyle = 'rgba(25,12,5,0.85)';
  g.fill();
  g.strokeStyle = '#f2c81e';
  g.lineWidth = 6;
  g.stroke();

  g.textAlign = 'center';
  g.fillStyle = '#f5deb3';
  g.font = 'bold 64px sans-serif';
  g.fillText('DJEMBE VR', 512, 85);

  g.font = '38px sans-serif';
  g.fillStyle = '#ffcf8a';
  if (state.mode === 'free') {
    g.fillText('FREE MODE: play anything you like', 512, 150);
  } else {
    g.fillText(`RHYTHM MODE   Score ${state.score}   Combo ${state.combo}`, 512, 150);
  }

  g.font = 'bold 72px sans-serif';
  g.fillStyle = state.judgeColor;
  g.fillText(state.judge, 512, 260);

  // Legend
  const items = [['bass', 'Bass: center'], ['tone', 'Tone: edge'], ['slap', 'Slap: edge, fast']];
  g.font = '32px sans-serif';
  items.forEach(([type, label], i) => {
    const x = 190 + i * 320;
    g.fillStyle = CSS_COLORS[type];
    g.beginPath(); g.arc(x - 110, 358, 16, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#f5deb3';
    g.textAlign = 'left';
    g.fillText(label, x - 85, 370);
  });
  g.textAlign = 'center';
  g.font = '28px sans-serif';
  g.fillStyle = '#c9b48f';
  g.fillText('Touch FREE or RHYTHM with your finger to switch mode', 512, 460);
  panelTex.needsUpdate = true;
}

function setJudge(text, color, duration = 0.7) {
  state.judge = text;
  state.judgeColor = color;
  state.judgeUntil = clock.getElapsedTime() + duration;
  drawPanel();
}

// =====================================================================
// Mode buttons (touch them with a finger)
// =====================================================================
function makeLabel(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 96;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(25,12,5,0.85)';
  g.beginPath(); g.roundRect(4, 4, 248, 88, 20); g.fill();
  g.fillStyle = '#f5deb3';
  g.font = 'bold 48px sans-serif';
  g.textAlign = 'center';
  g.fillText(text, 128, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
  sprite.scale.set(0.14, 0.0525, 1);
  return sprite;
}

function makeButton(label, mode, x) {
  const grp = new THREE.Group();
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.015, 0.02, 1, 10),
    new THREE.MeshStandardMaterial({ color: 0x4a2c16 })
  );
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055, 0.06, 0.03, 32),
    new THREE.MeshStandardMaterial({ color: 0x5a3218, roughness: 0.6 })
  );
  const topMat = new THREE.MeshStandardMaterial({ color: 0x777777, emissive: 0x000000 });
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.012, 32), topMat);
  top.position.y = 0.02;
  const sprite = makeLabel(label);
  sprite.position.y = 0.085;
  grp.add(base, top, sprite);
  station.add(grp, post);
  return { grp, post, top, topMat, mode, x };
}
const buttons = [makeButton('FREE', 'free', -0.36), makeButton('RHYTHM', 'rhythm', 0.36)];

function updateButtonColors() {
  for (const b of buttons) {
    const active = b.mode === state.mode;
    b.topMat.color.set(active ? 0x3acb5a : 0x777777);
    b.topMat.emissive.set(active ? 0x1a6a2a : 0x000000);
  }
}

// Position everything according to the skin height
function layout() {
  drumBody.scale.y = SKIN_Y / BASE_SKIN_Y;
  drumTop.position.y = SKIN_Y;
  panel.position.set(0, SKIN_Y + 0.45, -0.35);
  for (const b of buttons) {
    const h = SKIN_Y + 0.05;
    b.grp.position.set(b.x, h, 0.05);
    b.post.scale.y = h;
    b.post.position.set(b.x, h / 2, 0.05);
  }
}

// =====================================================================
// Sound (synthesised with the Web Audio API, no files needed)
// =====================================================================
let actx = null, master = null, noiseBuf = null;

function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = actx.createDynamicsCompressor();
  master = actx.createGain();
  master.gain.value = 0.9;
  master.connect(comp);
  comp.connect(actx.destination);
  noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
document.addEventListener('pointerdown', initAudio);

function osc(type, f0, f1, sweep, dur, gain) {
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + sweep);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}

function noise(filterType, freq, q, dur, gain) {
  const t = actx.currentTime;
  const src = actx.createBufferSource();
  src.buffer = noiseBuf;
  const f = actx.createBiquadFilter();
  f.type = filterType; f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur + 0.02);
}

function playDrum(type, vel) {
  initAudio();
  const v = 0.25 + 0.75 * vel;
  if (type === 'bass') {
    osc('sine', 120, 62, 0.12, 0.5, 0.9 * v);
    noise('lowpass', 400, 0.7, 0.08, 0.25 * v);
  } else if (type === 'tone') {
    osc('triangle', 340, 265, 0.05, 0.28, 0.55 * v);
    osc('sine', 520, 430, 0.04, 0.15, 0.2 * v);
    noise('bandpass', 1400, 1.2, 0.05, 0.25 * v);
  } else {
    noise('highpass', 2200, 0.8, 0.14, 0.8 * v);
    noise('bandpass', 900, 2, 0.06, 0.4 * v);
    osc('sine', 600, 480, 0.03, 0.09, 0.25 * v);
  }
}

function playTick(strong) {
  if (!actx) return;
  osc('sine', strong ? 1400 : 1000, strong ? 1400 : 1000, 0.01, 0.04, 0.08);
}

// =====================================================================
// Visual effects: ripples on the skin and a coloured flash
// =====================================================================
const ripples = [];
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(
    new THREE.RingGeometry(0.9, 1, 40),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false })
  );
  m.rotation.x = -Math.PI / 2;
  m.visible = false;
  m.userData.life = 1;
  station.add(m);
  ripples.push(m);
}
let rippleIndex = 0;
let flash = 0;

function spawnRipple(type, x, z) {
  const m = ripples[rippleIndex++ % ripples.length];
  m.position.set(x, SKIN_Y + 0.003, z);
  m.material.color.set(COLORS[type]);
  m.userData.life = 0;
  m.visible = true;
}

function updateFx(dt) {
  for (const m of ripples) {
    if (!m.visible) continue;
    m.userData.life += dt;
    const l = m.userData.life;
    const s = 0.015 + l * 0.35;
    m.scale.set(s, s, s);
    m.material.opacity = Math.max(0, 1 - l / 0.4);
    if (l > 0.4) m.visible = false;
  }
  flash = Math.max(0, flash - dt * 5);
  skinMat.emissiveIntensity = flash;
}

// =====================================================================
// Rhythm mode
// =====================================================================
const STEP = 0.2;     // seconds per step
const LEAD = 3.2;     // seconds before the first note
const FALL = 1.6;     // seconds a note takes to fall onto the drum
const DROP = 0.6;     // height the notes fall from (meters)
const WINDOW = 0.18;  // timing window to hit a note (seconds)
// B = bass, T = tone, S = slap, . = rest
const SONG =
  'B...B...T.T.S...' +
  'B...B...T.T.S.S.' +
  'B.T.T.S.B.T.T.S.' +
  'B.B.T.T.S.T.T.S.' +
  'S.S.S...T.T.T...' +
  'B...B...B.T.S...';
const TYPE_OF = { B: 'bass', T: 'tone', S: 'slap' };
const NOTE_XZ = { bass: [0, 0], tone: [-0.115, 0.04], slap: [0.115, 0.04] };

const noteGeo = new THREE.SphereGeometry(0.022, 16, 12);
const noteMats = {};
for (const t of ['bass', 'tone', 'slap']) {
  noteMats[t] = new THREE.MeshStandardMaterial({ color: COLORS[t], emissive: COLORS[t], emissiveIntensity: 0.8 });
}

let notes = [];
let nextTick = Infinity;
let tickCount = 0;
let songEnd = Infinity;

function clearNotes() {
  for (const n of notes) station.remove(n.mesh);
  notes = [];
}

function startSong() {
  clearNotes();
  const now = clock.getElapsedTime();
  const start = now + LEAD;
  for (let i = 0; i < SONG.length; i++) {
    const type = TYPE_OF[SONG[i]];
    if (!type) continue;
    const mesh = new THREE.Mesh(noteGeo, noteMats[type]);
    mesh.visible = false;
    station.add(mesh);
    notes.push({ time: start + i * STEP, type, judged: false, mesh });
  }
  state.score = 0; state.combo = 0; state.bestCombo = 0; state.hits = 0;
  state.totalNotes = notes.length;
  state.finished = false;
  songEnd = start + SONG.length * STEP + 0.6;
  nextTick = start - 4 * STEP * 4;   // 4 beat count-in
  tickCount = 0;
  setJudge('Get ready!', '#ffffff', LEAD - 0.4);
}

function stopSong() {
  clearNotes();
  nextTick = Infinity;
  songEnd = Infinity;
}

function updateSong(now) {
  if (state.mode !== 'rhythm') return;

  // Metronome: one tick per beat (every 4 steps)
  if (now >= nextTick && now < songEnd) {
    playTick(tickCount % 4 === 0);
    tickCount++;
    nextTick += STEP * 4;
  }

  for (const n of notes) {
    if (n.judged) continue;
    const ahead = n.time - now;
    if (ahead <= FALL && ahead > -WINDOW) {
      const [x, z] = NOTE_XZ[n.type];
      n.mesh.visible = true;
      n.mesh.position.set(x, SKIN_Y + 0.025 + Math.max(0, ahead) / FALL * DROP, z);
    }
    if (ahead < -WINDOW) {
      n.judged = true;
      n.mesh.visible = false;
      state.combo = 0;
      setJudge('Miss', '#c89a9a', 0.5);
    }
  }

  if (!state.finished && now > songEnd) {
    state.finished = true;
    const acc = Math.round(100 * state.hits / Math.max(1, state.totalNotes));
    setJudge(`Done! ${state.score} pts, ${acc}%`, '#7dff7a', Infinity);
  }
}

function judgeHit(type, now) {
  let best = null, bestD = Infinity;
  for (const n of notes) {
    if (n.judged) continue;
    const d = Math.abs(now - n.time);
    if (d <= WINDOW && d < bestD) { best = n; bestD = d; }
  }
  if (!best) return;
  best.judged = true;
  best.mesh.visible = false;
  if (best.type === type) {
    const perfect = bestD < 0.07;
    state.score += perfect ? 100 : 50;
    state.combo++;
    state.hits++;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
    setJudge(perfect ? 'Perfect!' : 'Good', perfect ? '#7dff7a' : '#ffe27a');
  } else {
    state.score += 10;
    state.combo = 0;
    setJudge(`Wrong sound (${best.type})`, '#ff8a7a');
  }
}

function setMode(mode) {
  state.mode = mode;
  updateButtonColors();
  if (mode === 'rhythm') {
    startSong();
  } else {
    stopSong();
    setJudge('Hit the drum!', '#ffffff', Infinity);
  }
  drawPanel();
}

// =====================================================================
// A hit on the drum (from hands, mouse or keyboard)
// =====================================================================
function triggerHit(type, vel, x, z) {
  playDrum(type, vel);
  spawnRipple(type, x, z);
  skinMat.emissive.set(COLORS[type]);
  flash = 0.6 + 0.4 * vel;
  const now = clock.getElapsedTime();
  if (state.mode === 'rhythm' && !state.finished) {
    judgeHit(type, now);
  } else if (state.mode === 'free') {
    const names = { bass: 'BASS', tone: 'TONE', slap: 'SLAP' };
    setJudge(names[type], CSS_COLORS[type], 0.5);
  }
}

// =====================================================================
// Hand tracking
// =====================================================================
const handFactory = new XRHandModelFactory();
const hands = [];
for (let i = 0; i < 2; i++) {
  const hand = renderer.xr.getHand(i);
  hand.add(handFactory.createHandModel(hand, 'mesh'));
  scene.add(hand);
  hands.push({ hand, prev: {}, cooldown: 0 });
}

const HIT_JOINTS = ['index-finger-tip', 'middle-finger-tip', 'ring-finger-tip', 'middle-finger-metacarpal'];
const tmp = new THREE.Vector3();
let buttonCooldown = 0;

function updateHands(dt, now) {
  for (const h of hands) {
    const joints = h.hand.joints;
    if (!joints) continue;
    let hit = null;

    for (const name of HIT_JOINTS) {
      const j = joints[name];
      if (!j || !j.visible) { delete h.prev[name]; continue; }
      j.getWorldPosition(tmp);
      station.worldToLocal(tmp);
      const prevY = h.prev[name];
      h.prev[name] = tmp.y;
      if (prevY === undefined) continue;

      const vy = (tmp.y - prevY) / dt;
      const r = Math.hypot(tmp.x, tmp.z);
      if (r > R * 1.15) continue;
      const crossed = prevY > SKIN_Y + 0.004 && tmp.y <= SKIN_Y + 0.012;
      if (crossed && vy < -0.35 && (!hit || vy < hit.vy)) {
        hit = { r, vy, x: tmp.x, z: tmp.z };
      }
    }

    if (hit && now > h.cooldown) {
      h.cooldown = now + 0.12;
      const speed = -hit.vy;
      const vel = Math.min(1, Math.max(0, (speed - 0.3) / 2.2));
      const type = hit.r < R * 0.5 ? 'bass' : (speed > 1.5 ? 'slap' : 'tone');
      triggerHit(type, vel, hit.x, hit.z);
    }

    // Mode buttons: touch with the index finger tip
    const tip = joints['index-finger-tip'];
    if (tip && tip.visible && now > buttonCooldown) {
      tip.getWorldPosition(tmp);
      station.worldToLocal(tmp);
      for (const b of buttons) {
        const bx = b.grp.position.x, by = b.grp.position.y + 0.02, bz = b.grp.position.z;
        if (Math.hypot(tmp.x - bx, tmp.y - by, tmp.z - bz) < 0.055) {
          buttonCooldown = now + 1.0;
          playTick(true);
          setMode(b.mode);
        }
      }
    }
  }
}

// =====================================================================
// Place the drum in front of the player when VR starts
// =====================================================================
let calibrateAt = 0;

function calibrate() {
  const xrCam = renderer.xr.getCamera();
  const head = new THREE.Vector3().setFromMatrixPosition(xrCam.matrixWorld);
  const dir = new THREE.Vector3();
  xrCam.getWorldDirection(dir);
  dir.y = 0;
  if (dir.lengthSq() < 1e-4) dir.set(0, 0, -1);
  dir.normalize();

  if (head.y > 0.3) SKIN_Y = THREE.MathUtils.clamp(head.y - 0.62, 0.5, 1.05);
  station.position.set(head.x + dir.x * 0.42, 0, head.z + dir.z * 0.42);
  station.rotation.set(0, Math.atan2(-dir.x, -dir.z), 0);
  station.updateMatrixWorld(true);
  layout();
  for (const h of hands) h.prev = {};
}

function resetStation() {
  SKIN_Y = BASE_SKIN_Y;
  station.position.set(0, 0, 0);
  station.rotation.set(0, 0, 0);
  station.updateMatrixWorld(true);
  layout();
}

renderer.xr.addEventListener('sessionstart', () => {
  initAudio();
  calibrateAt = clock.getElapsedTime() + 1.0;
});
renderer.xr.addEventListener('sessionend', resetStation);

// =====================================================================
// Mouse and keyboard (to test on a computer)
// =====================================================================
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (renderer.xr.isPresenting) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const targets = [skin, ...buttons.map(b => b.top)];
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return;
  const obj = hits[0].object;
  const btn = buttons.find(b => b.top === obj);
  if (btn) { setMode(btn.mode); return; }
  const p = station.worldToLocal(hits[0].point.clone());
  const r = Math.hypot(p.x, p.z);
  const type = e.shiftKey ? 'slap' : (r < R * 0.5 ? 'bass' : 'tone');
  triggerHit(type, 0.8, p.x, p.z);
});

addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  initAudio();
  if (k === '1') setMode('free');
  else if (k === '2') setMode('rhythm');
  else if (k === 'b') triggerHit('bass', 0.8, 0, 0);
  else if (k === 't') triggerHit('tone', 0.8, -0.12, 0.04);
  else if (k === 's') triggerHit('slap', 0.8, 0.12, 0.04);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// =====================================================================
// Main loop
// =====================================================================
layout();
updateButtonColors();
drawPanel();

let last = 0;
renderer.setAnimationLoop(() => {
  const now = clock.getElapsedTime();
  const dt = Math.min(Math.max(now - last, 1 / 240), 0.05);
  last = now;

  if (calibrateAt && now > calibrateAt) { calibrate(); calibrateAt = 0; }
  if (renderer.xr.isPresenting) updateHands(dt, now);

  updateSong(now);
  updateFx(dt);

  if (state.judge && now > state.judgeUntil) {
    state.judge = '';
    state.judgeUntil = Infinity;
    drawPanel();
  }

  // Campfire flicker
  fireLight.intensity = 5 + Math.sin(now * 13) * 0.8 + Math.sin(now * 7.3) * 0.6;
  flame.scale.y = 1 + Math.sin(now * 11) * 0.12;

  renderer.render(scene, camera);
});
</script>
</body>
</html>
